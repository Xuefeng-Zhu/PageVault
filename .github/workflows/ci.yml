name: ci

# Placeholder CI for PageVault.
#
# Runs on every push to any branch and on every pull request targeting
# `main`. K-17 will expand this with caching, matrix builds, and InsForge
# integration. The job below is intentionally minimal: install, typecheck,
# lint, test, build. The `build` step is the slowest; on a healthy PR it
# should pass in under a couple of minutes.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
        env:
          # lib/scan.ts has a top-level guard that throws if
          # INSFORGE_API_URL is unset, and the new lib/scan.test.ts
          # imports from it. The guard refuses to run scans against
          # an unknown InsForge tenant in production but CI is a
          # test environment with mocked dns.lookup + mocked fetch,
          # so we seed placeholder values here. Real integration
          # tests (K-17) will use the project's test tenant.
          INSFORGE_API_URL: "https://ci-placeholder.insforge.app"
          INSFORGE_SERVICE_ROLE_KEY: "ci-placeholder-service-role-key-must-be-at-least-32-chars-long"
          NEXT_PUBLIC_INSFORGE_ANON_KEY: "ci-placeholder-anon-key-must-be-at-least-32-chars-long"
          CRON_SHARED_SECRET: "ci-placeholder-cron-secret-must-be-at-least-32-chars-long"
          NEXTAUTH_SECRET: "ci-placeholder-nextauth-secret-must-be-at-least-32-chars-long"
          INSFORGE_DEV_DEMO_AUTH: "1"
          CI: "1"

      - name: Build
        run: npm run build
        env:
          # Build should not require live credentials — the app is wired
          # for missing-credential mock fallbacks. If the build ever
          # starts requiring secrets, fail loud here, not in prod.
          NEXT_TELEMETRY_DISABLED: "1"
          # lib/scan.ts has a top-level guard that throws at module load
          # when INSFORGE_API_URL is unset, and `next build` imports
          # API routes (e.g. app/api/cron/scan-all/route.ts) which
          # transitively import lib/scan.ts. Seed the same placeholder
          # values we use in the Test step. The build doesn't actually
          # connect to InsForge (mock fallbacks fire for every other
          # integration), it just needs the guard to not throw at load.
          INSFORGE_API_URL: "https://ci-placeholder.insforge.app"
          INSFORGE_SERVICE_ROLE_KEY: "ci-placeholder-service-role-key-must-be-at-least-32-chars-long"
          NEXT_PUBLIC_INSFORGE_ANON_KEY: "ci-placeholder-anon-key-must-be-at-least-32-chars-long"
          CRON_SHARED_SECRET: "ci-placeholder-cron-secret-must-be-at-least-32-chars-long"
          NEXTAUTH_SECRET: "ci-placeholder-nextauth-secret-must-be-at-least-32-chars-long"
          INSFORGE_DEV_DEMO_AUTH: "1"
          CI: "1"
